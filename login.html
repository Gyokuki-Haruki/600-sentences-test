<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5c84c"><title>ログイン | Sentence Studio</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/auth.js"></script></head>
<body><section class="auth-screen"><div class="auth-card"><a class="brand auth-brand" href="login.html"><span class="brandmark">✳</span><span>Sentence Studio<small>ENGLISH PRACTICE</small></span></a><div class="auth-intro"><span class="eyebrow">YOUR ENGLISH JOURNEY</span><h1>英文を、自分のものに。</h1><p>管理者から配布されたIDでログインしてください。</p></div><form id="loginForm" class="auth-form active"><label for="loginId">ID</label><input id="loginId" autocomplete="username" placeholder="配布されたID" required><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" placeholder="パスワード" required><button class="btn primary wide" type="submit">ログイン</button></form><div id="message" class="message" role="status" aria-live="polite"></div><div class="divider"><span>アカウントについて</span></div><p class="auth-note">アカウントは管理者が発行します。初回ログイン後はマイページでパスワードを変更してください。</p></div></section>
<script>
const form=document.querySelector('#loginForm'), message=document.querySelector('#message');
function say(text,error=false){message.textContent=text;message.classList.toggle('error',error)}
if(new URLSearchParams(location.search).get('error')==='config')say('Supabaseの接続設定がありません。管理者に確認してください。',true);
form.onsubmit=async e=>{e.preventDefault();const id=document.querySelector('#loginId').value.trim(),password=document.querySelector('#password').value,button=e.submitter;if(!/^[a-zA-Z0-9._-]{1,64}$/.test(id)){say('IDは英数字、.、_、- のみ使用できます。',true);return}if(!window.authClient){say('Supabase接続情報が設定されていません。管理者に確認してください。',true);return}button.disabled=true;button.textContent='ログイン中…';try{const {data,error}=await authClient.auth.signInWithPassword({email:authEmail(id),password});if(error)throw error;location.replace(data.user.app_metadata?.must_change_password?'mypage.html?firstLogin=1':'index.html')}catch(err){console.error(err);say(err.message==='Email not confirmed'?'ログインできません。管理者に確認してください。':`ログインできませんでした。IDとパスワードを確認してください。（${err.message}）`,true);button.disabled=false;button.textContent='ログイン'}};

(async()=>{if(!authClient)return;const {data:{session}}=await authClient.auth.getSession();if(session)location.replace(session.user.app_metadata?.must_change_password?'mypage.html?firstLogin=1':'index.html')})();
</script></body></html>
